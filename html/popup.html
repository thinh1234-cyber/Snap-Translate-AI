<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Snap & Translate AI</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>

<body>
  <div class="popup-container">
    <div class="header">
      <img src="../assets/icon.png" alt="Logo" class="logo">
      <div class="title-box">
        <h1>Snap & Translate AI</h1>
        <p class="subtitle">Trợ lý Tầm nhìn Thông minh</p>
      </div>
    </div>

    <div class="action-grid">
      <button id="snap-translate-btn" class="main-action-btn" style="background-color: #1a73e8;">
        <span class="icon">🌍</span>
        <span class="text">Snap Dịch<br><small>(Alt+X)</small></span>
      </button>

      <button id="snap-qr-btn" class="main-action-btn" style="background-color: #0f9d58;">
        <span class="icon">📷</span>
        <span class="text">Snap Đọc QR</span>
      </button>

      <button id="options-btn" class="secondary-btn" style="grid-column: span 2;">
        <span class="icon">⚙️</span>
        <span class="text">Setting</span>
      </button>
    </div>

    <div class="footer">
      <span>Đã kết nối với lõi xử lý AI Engine.</span>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>

</html>
