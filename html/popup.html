<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Snap Decode</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>

<body>
  <div class="popup-container">
    <div class="header">
      <img src="../assets/icon.png" alt="Logo" class="logo">
      <div class="title-box">
        <h1>Snap Decode</h1>
        <p class="subtitle">Trích xuất OCR & Quét Mã QR</p>
      </div>
      <div class="header-actions">
        <button id="guide-btn" class="header-icon-btn" title="Hướng dẫn">📖</button>
        <button id="options-btn" class="header-icon-btn" title="Cài đặt">⚙️</button>
      </div>
    </div>

    <div class="action-grid">
      <button id="snap-ocr-btn" class="main-action-btn" style="background-color: #1a73e8;">
        <span class="icon">🔍</span>
        <span class="text">Snap OCR<br><small>(Alt+X)</small></span>
      </button>

      <button id="snap-qr-btn" class="main-action-btn" style="background-color: #0f9d58;">
        <span class="icon">📷</span>
        <span class="text">Snap Đọc QR</span>
      </button>
    </div>

    <div class="footer">
      <span>Vision Engine: RapidOCR & OpenCV</span>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>

</html>
